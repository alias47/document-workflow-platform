<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change Password – EduFlow</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">
        <svg width="18" height="18" viewBox="0 0 19 19" fill="none" aria-hidden="true">
          <path d="M3.5 5h12M3.5 9.5h8M3.5 14h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="auth-logo__name">EduFlow</span>
    </div>

    <!-- First-login notice (shown when ?first=true in URL) -->
    <div id="first-login-notice" class="alert alert-info" style="margin-bottom:var(--space-5); display:none;">
      <span class="alert-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </span>
      <div>
        <div class="alert-title">Welcome to EduFlow!</div>
        For security, please change your temporary password before continuing.
      </div>
    </div>

    <h1 class="auth-heading">Change password</h1>
    <p class="auth-subheading" id="cp-subtitle">Choose a new, strong password for your account.</p>

    <!-- Error banner -->
    <div id="cp-error" class="login-error" role="alert" aria-live="polite"></div>

    <div class="auth-fields">

      <!-- Show current password only if NOT first-login -->
      <div class="field" id="current-pw-field">
        <label class="field-label" for="cp-current">Current password</label>
        <div style="position:relative;">
          <input class="field-input" id="cp-current" name="current_password" type="password"
            placeholder="••••••••" autocomplete="current-password" style="padding-right:42px;" />
          <button type="button" class="pw-toggle" data-target="cp-current"
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-neutral-400); cursor:pointer; padding:4px; display:flex; align-items:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="cp-new">New password</label>
        <div style="position:relative;">
          <input class="field-input" id="cp-new" name="new_password" type="password"
            placeholder="••••••••" autocomplete="new-password" style="padding-right:42px;" />
          <button type="button" class="pw-toggle" data-target="cp-new"
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-neutral-400); cursor:pointer; padding:4px; display:flex; align-items:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <!-- Password strength -->
        <div id="pw-strength-bar" style="display:none; margin-top:var(--space-2);">
          <div class="progress" style="height:4px;">
            <div id="pw-strength-fill" class="progress-bar" style="width:0%; transition:width 0.3s;"></div>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top:4px;">
            <span id="pw-strength-label" style="font-size:var(--font-size-xs); color:var(--color-neutral-500);"></span>
            <span style="font-size:var(--font-size-xs); color:var(--color-neutral-400);">Min. 12 characters</span>
          </div>
        </div>

        <!-- Requirements checklist -->
        <div id="pw-requirements" style="display:none; margin-top:var(--space-2);">
          <div id="req-length" class="pw-req">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
            At least 12 characters
          </div>
          <div id="req-upper" class="pw-req">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
            One uppercase letter
          </div>
          <div id="req-number" class="pw-req">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
            One number
          </div>
          <div id="req-special" class="pw-req">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
            One special character
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="cp-confirm">Confirm new password</label>
        <div style="position:relative;">
          <input class="field-input" id="cp-confirm" name="confirm_password" type="password"
            placeholder="••••••••" autocomplete="new-password" style="padding-right:42px;" />
          <button type="button" class="pw-toggle" data-target="cp-confirm"
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--color-neutral-400); cursor:pointer; padding:4px; display:flex; align-items:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span id="confirm-match" style="font-size:var(--font-size-xs); display:none;"></span>
      </div>

    </div>

    <button class="btn-login" id="btn-change-pw" type="button">Change password</button>

    <a href="login.html" class="auth-footer-link" id="back-link">← Back to sign in</a>

  </div>
</div>

<style>
  .pw-req {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--color-neutral-400);
    margin-top: 4px;
    transition: color 0.15s;
  }
  .pw-req.met {
    color: var(--color-success-600);
  }
  .pw-req.met svg { stroke: var(--color-success-600); }
</style>

<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {

    const params = new URLSearchParams(window.location.search);
    const isFirst = params.get('first') === 'true';

    if (isFirst) {
      document.getElementById('first-login-notice').style.display = 'flex';
      document.getElementById('current-pw-field').style.display = 'none';
      document.getElementById('cp-subtitle').textContent = 'Create a new password to secure your portal account.';
      document.getElementById('back-link').style.display = 'none';
    }

    // Password visibility toggles
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const isText = input.type === 'text';
        input.type = isText ? 'password' : 'text';
        btn.innerHTML = isText
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      });
    });

    // Password strength meter
    const newPwInput = document.getElementById('cp-new');
    newPwInput.addEventListener('input', () => {
      const val = newPwInput.value;
      const strengthBar = document.getElementById('pw-strength-bar');
      const reqs = document.getElementById('pw-requirements');
      const fill = document.getElementById('pw-strength-fill');
      const label = document.getElementById('pw-strength-label');

      if (!val) { strengthBar.style.display = 'none'; reqs.style.display = 'none'; return; }
      strengthBar.style.display = 'block';
      reqs.style.display = 'block';

      const hasLength  = val.length >= 12;
      const hasUpper   = /[A-Z]/.test(val);
      const hasNumber  = /[0-9]/.test(val);
      const hasSpecial = /[^a-zA-Z0-9]/.test(val);

      setReq('req-length',  hasLength);
      setReq('req-upper',   hasUpper);
      setReq('req-number',  hasNumber);
      setReq('req-special', hasSpecial);

      const score = [hasLength, hasUpper, hasNumber, hasSpecial].filter(Boolean).length;
      const strengths = [
        { w: '25%', color: 'var(--color-danger-500)',  text: 'Weak' },
        { w: '50%', color: 'var(--color-warning-500)', text: 'Fair' },
        { w: '75%', color: 'var(--color-brand-500)',   text: 'Good' },
        { w: '100%',color: 'var(--color-success-500)', text: 'Strong' },
      ];
      const s = strengths[score - 1] || strengths[0];
      fill.style.width = s.w;
      fill.style.background = s.color;
      label.textContent = s.text;
      label.style.color = s.color;
    });

    function setReq(id, met) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle('met', met);
      el.querySelector('svg').innerHTML = met
        ? `<polyline points="20 6 9 17 4 12"/>`
        : `<circle cx="12" cy="12" r="10"/>`;
    }

    // Confirm match indicator
    const confirmInput = document.getElementById('cp-confirm');
    confirmInput.addEventListener('input', () => {
      const matchEl = document.getElementById('confirm-match');
      const matches = confirmInput.value === newPwInput.value;
      matchEl.style.display = confirmInput.value ? 'block' : 'none';
      matchEl.textContent = matches ? '✓ Passwords match' : '✕ Passwords do not match';
      matchEl.style.color = matches ? 'var(--color-success-600)' : 'var(--color-danger-600)';
    });

    // Submit
    const errorEl = document.getElementById('cp-error');
    document.getElementById('btn-change-pw').addEventListener('click', async () => {
      errorEl.classList.remove('visible');
      const current  = document.getElementById('cp-current')?.value ?? 'SKIP';
      const newPw    = newPwInput.value;
      const confirm  = confirmInput.value;

      if (!isFirst && !current) { errorEl.textContent = 'Please enter your current password.'; errorEl.classList.add('visible'); return; }
      if (!newPw)    { errorEl.textContent = 'Please enter a new password.'; errorEl.classList.add('visible'); return; }
      if (newPw.length < 12) { errorEl.textContent = 'Password must be at least 12 characters.'; errorEl.classList.add('visible'); return; }
      if (newPw !== confirm) { errorEl.textContent = 'Passwords do not match.'; errorEl.classList.add('visible'); return; }

      const btn = document.getElementById('btn-change-pw');
      btn.disabled = true;
      btn.textContent = 'Changing…';

      // TODO: replace with fetch('/api/auth/change-password', { method:'POST', body: JSON.stringify({ current_password: current, new_password: newPw }) })
      await new Promise(r => setTimeout(r, 1200));

      btn.textContent = '✓ Password changed!';
      setTimeout(() => {
        window.location.href = isFirst ? 'portal/dashboard.html' : 'login.html';
      }, 1500);
    });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password – EduFlow</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo__icon">
        <svg width="18" height="18" viewBox="0 0 19 19" fill="none" aria-hidden="true">
          <path d="M3.5 5h12M3.5 9.5h8M3.5 14h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="auth-logo__name">EduFlow</span>
    </div>

    <!-- Default state -->
    <div id="state-default">
      <h1 class="auth-heading">Forgot password?</h1>
      <p class="auth-subheading">
        Enter the email address you use to sign in. We'll send a reset link to your inbox.
      </p>

      <!-- Error banner -->
      <div id="fp-error" class="login-error" role="alert" aria-live="polite"></div>

      <div class="auth-fields">
        <div class="field">
          <label class="field-label" for="fp-email">Email address</label>
          <input class="field-input" id="fp-email" name="email" type="email"
            placeholder="you@consultancy.com" autocomplete="email" required />
        </div>
      </div>

      <button class="btn-login" id="btn-send-reset" type="button">Send reset link</button>

      <a href="login.html" class="auth-footer-link">← Back to sign in</a>
    </div>

    <!-- Success state (hidden by default) -->
    <div id="state-success" hidden>
      <div style="text-align:center; padding: var(--space-4) 0;">
        <div style="width:64px; height:64px; background:var(--color-success-100); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-5); color:var(--color-success-600);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <h2 style="font-size:var(--font-size-xl); font-weight:var(--font-weight-extrabold); color:var(--color-neutral-900); margin-bottom:var(--space-2);">Check your email</h2>
        <p style="font-size:var(--font-size-sm); color:var(--color-neutral-500); line-height:var(--line-height-loose); margin-bottom:var(--space-6);">
          We've sent a password reset link to <strong id="sent-email"></strong>. The link will expire in 30 minutes.
        </p>
        <p style="font-size:var(--font-size-xs); color:var(--color-neutral-400);">
          Didn't receive it? Check your spam folder or
          <button id="btn-resend" style="background:none; border:none; color:var(--color-brand-600); font-weight:600; cursor:pointer; font-size:inherit; padding:0;">
            resend the email
          </button>.
        </p>
      </div>
      <a href="login.html" class="auth-footer-link" style="margin-top:var(--space-4);">← Back to sign in</a>
    </div>

  </div>
</div>

<script src="css/styles.css" onerror=""></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {

    const btnSend = document.getElementById('btn-send-reset');
    const emailInput = document.getElementById('fp-email');
    const errorEl = document.getElementById('fp-error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function hideError() {
      errorEl.classList.remove('visible');
    }

    btnSend.addEventListener('click', async () => {
      hideError();
      const email = emailInput.value.trim();
      if (!email) { showError('Please enter your email address.'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }

      btnSend.disabled = true;
      btnSend.textContent = 'Sending…';

      // TODO: replace with fetch('/api/auth/forgot-password', { method:'POST', body: JSON.stringify({ email }) })
      await new Promise(r => setTimeout(r, 1200));

      document.getElementById('sent-email').textContent = email;
      document.getElementById('state-default').hidden = true;
      document.getElementById('state-success').removeAttribute('hidden');
    });

    document.getElementById('btn-resend')?.addEventListener('click', () => {
      toast('Reset email resent!', 'info');
    });
  });
</script>

</body>
</html>
